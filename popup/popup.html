<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cyber City Calendar View</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="extension-container">
      <header class="header">
        <h2>⚡ CYBER CITY CALENDAR</h2>
      </header>

      <!-- 3D Viewport Wrapper -->
      <div id="viewportContainer">
        <canvas id="cyberCanvas" width="920" height="460"></canvas>

        <!-- Instant Hover Tooltip HUD -->
        <div id="hudCard" class="hud-card"></div>
      </div>

      <!-- Navigation Controls directly BELOW the City Viewport -->
      <div class="controls-panel-below">
        <div class="panel-label">CAMERA & PAN CONTROLS</div>
        <div class="dpad-container">
          <button class="ctrl-btn" id="btnPanUp" title="Pan North (W / ▲)">
            ▲
          </button>
          <div class="control-row">
            <button class="ctrl-btn" id="btnPanLeft" title="Pan West (A / ◄)">
              ◄
            </button>
            <button
              class="ctrl-btn reset-btn"
              id="btnPanReset"
              title="Reset Viewport (R)"
            >
              RESET
            </button>
            <button class="ctrl-btn" id="btnPanRight" title="Pan East (D / ►)">
              ►
            </button>
          </div>
          <button class="ctrl-btn" id="btnPanDown" title="Pan South (S / ▼)">
            ▼
          </button>
        </div>
        <div class="help-hint">
          Use <strong>Mouse Drag</strong> to Orbit | <strong>Scroll</strong> to
          Zoom | <strong>WASD / Arrow Keys</strong> to Pan
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
